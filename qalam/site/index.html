<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalam</title>
<meta name="description" content="Qalam is a design studio. We redesign websites and apps for businesses in the Arab world.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M10 22 L22 10' stroke='%23fff' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#000;font:400 18px/1.45 "Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",sans-serif}
a{color:inherit}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:28px 32px}
.top{display:flex;justify-content:flex-end;font-size:14px}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-content:end;padding:10vh 0 7vh}
h1{grid-column:1/13;position:relative;cursor:default;margin-bottom:5vh}
.wsvg{display:block;overflow:visible}
.wsvg.en{width:min(100%,1180px);height:auto}
.wsvg.ar{height:clamp(200px,32vw,460px);width:auto;margin-inline-end:auto}
.sig{position:absolute;width:clamp(70px,9vw,140px);height:auto;overflow:visible;transform:rotate(-8deg)}
.en+.sig{left:min(calc(100% - 9vw),1180px);top:-2vw}
.wsvg path,.sig path{fill:#000;fill-opacity:0;stroke:#000;stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.go path{animation:draw var(--d,1.3s) cubic-bezier(.55,0,.2,1) forwards,ink .6s ease forwards;animation-delay:calc(var(--s,0s) + var(--i)*var(--g,.16s)),calc(var(--s,0s) + var(--i)*var(--g,.16s) + var(--d,1.3s) - .25s)}
.wsvg.ar{--g:.45s;--d:1.5s}
.sig{--s:1.9s;--g:.3s;--d:.9s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ink{to{fill-opacity:1;stroke-width:0}}
.a{grid-column:1/6;font-size:22px;line-height:1.35}
.b{grid-column:7/12;font-size:22px;line-height:1.35}
.b a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.b a:hover{text-decoration-thickness:2px}
.bottom{display:flex;justify-content:space-between;font-size:14px}
.a,.b{opacity:0;transform:translateY(10px);transition:opacity .9s ease 1.4s,transform .9s ease 1.4s}
.ready .a,.ready .b{opacity:1;transform:none}
.ready .b{transition-delay:1.55s}
@media (max-width:760px){
 .page{padding:20px}.a,.b{grid-column:1/13;font-size:20px}
 main{padding:10vh 0 6vh;gap:18px}.sig{width:56px}.en+.sig{left:auto;right:2px;top:-64px}
}
@media (prefers-reduced-motion:reduce){.wsvg path,.sig path{fill-opacity:1;stroke:none;animation:none!important}.a,.b{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><button id="lang" type="button">العربية</button></div>
  <main>
    <h1 id="mark"></h1>
    <p class="a" data-i="a">We redesign websites and apps for businesses in the Arab world.</p>
    <p class="b"><span data-i="b">Send us your website and we'll tell you what we would change.</span><br><a href="mailto:hello@qalamcreative.com">hello@qalamcreative.com</a></p>
  </main>
  <div class="bottom"><span data-i="f">Qalam</span><span data-i="g">قلم</span></div>
</div>
