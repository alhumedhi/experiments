<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalam</title>
<meta name="description" content="Qalam is a design studio. We redesign websites and apps for businesses in the Arab world.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M10 22 L22 10' stroke='%23fff' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#000;font:400 18px/1.45 "Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",sans-serif}
a{color:inherit}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:28px 32px}
.top,.bottom{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;font-size:14px}
.top .l,.bottom .l{grid-column:1/7}.top .r,.bottom .r{grid-column:7/13;text-align:end}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-content:end;padding:12vh 0 8vh}
h1{grid-column:1/13;font-weight:600;font-size:clamp(88px,19vw,300px);line-height:.82;letter-spacing:-.06em;border-bottom:2px solid #000;padding-bottom:28px}
[dir=rtl] h1{letter-spacing:0;line-height:1.05;font-size:clamp(96px,20vw,320px);padding-bottom:.32em}
.a{grid-column:1/6;padding-top:24px;font-size:22px;line-height:1.35}
.b{grid-column:7/12;padding-top:24px;font-size:22px;line-height:1.35}
.b a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.b a:hover{text-decoration-thickness:2px}
.bottom{border-top:1px solid #000;padding-top:14px}
h1,.a,.b{opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
.ready h1,.ready .a,.ready .b{opacity:1;transform:none}
.ready .a{transition-delay:.15s}.ready .b{transition-delay:.25s}
@media (max-width:760px){
 .page{padding:20px}
 .a,.b{grid-column:1/13;font-size:20px}.b{padding-top:0}
 main{padding:10vh 0 6vh;gap:18px}
}
@media (prefers-reduced-motion:reduce){h1,.a,.b{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><span class="l" data-i="t">Design studio</span><span class="r"><button id="lang" type="button">العربية</button></span></div>
  <main>
    <h1 data-i="h">Qalam</h1>
    <p class="a" data-i="a">We redesign websites and apps for businesses in the Arab world.</p>
    <p class="b"><span data-i="b">Send us your website and we'll tell you what we would change.</span><br><a href="mailto:hello@qalamcreative.com">hello@qalamcreative.com</a></p>
  </main>
  <div class="bottom"><span class="l" data-i="f">Qalam</span><span class="r" data-i="g">قلم</span></div>
</div>
<script>
const AR={t:"استوديو تصميم",h:"قلم",a:"نعيد تصميم المواقع والتطبيقات للشركات في العالم العربي.",b:"أرسل لنا رابط موقعك، ونخبرك بما سنغيّره.",f:"قلم",g:"Qalam"};
const EN={};document.querySelectorAll('[data-i]').forEach(e=>EN[e.dataset.i]=e.textContent);
function setLang(l){const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';const d=l==='ar'?AR:EN;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=d[e.dataset.i]);
 document.getElementById('lang').textContent=l==='ar'?'English':'العربية';try{localStorage.setItem('qalam-lang',l)}catch(e){}}
document.getElementById('lang').onclick=()=>setLang(document.documentElement.lang==='ar'?'en':'ar');
try{if(localStorage.getItem('qalam-lang')==='ar')setLang('ar')}catch(e){}
requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
</script>
</body>
</html>
