*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:#000;font:400 18px/1.45 "Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",sans-serif}
a{color:inherit}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:28px 32px}
.top{display:flex;justify-content:flex-end;font-size:14px}
button{font:inherit;background:none;border:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-content:end;padding:10vh 0 7vh}

.w{display:block;overflow:visible}
.w.en{width:min(100%,1180px);height:auto}
.w.ar{height:clamp(200px,32vw,460px);width:auto;margin-inline-end:auto}
.w.sig{position:absolute;width:clamp(70px,9vw,140px);height:auto;transform:rotate(-8deg)}
.w.en+.w.sig{left:min(calc(100% - 9vw),1180px);top:-2vw}
.nib{fill:#000;transition:opacity .4s}
.a,.b{font-size:22px;line-height:1.35}
.a{grid-column:1/6}.b{grid-column:7/12}
.b a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.b a:hover{text-decoration-thickness:2px}
.bottom{display:flex;justify-content:space-between;font-size:14px}
.a,.b{opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.shown .a,.shown .b{opacity:1;transform:none}.shown .b{transition-delay:.15s}
@media (max-width:760px){
 .page{padding:20px}.a,.b{grid-column:1/13;font-size:20px}

</style>

function setLang(l){const h=document.documentElement;h.lang=l;h.dir=l==='ar'?'rtl':'ltr';const d=l==='ar'?AR:EN;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=d[e.dataset.i]);
 document.getElementById('lang').textContent=l==='ar'?'English':'العربية';render(l);try{localStorage.setItem('qalam-lang',l)}catch(e){}}
document.getElementById('lang').onclick=()=>setLang(document.documentElement.lang==='ar'?'en':'ar');
let start='en';try{if(localStorage.getItem('qalam-lang')==='ar')start='ar'}catch(e){}
setLang(start);
</script>
</body>
</html>
